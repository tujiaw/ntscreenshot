name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / MSVC
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Enable MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: 'qtpositioning qtwebchannel qtwebengine'
          cache: true

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ddd0023b0eee70986e42ed49d9d4afb8098f212e

      - name: Check repository
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build/ci-windows -G Ninja
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build/ci-windows --parallel

      - name: Test
        run: ctest --test-dir build/ci-windows --output-on-failure

      - name: Package
        shell: pwsh
        run: >-
          ./scripts/package-win.ps1
          -Config Release
          -Platform x64
          -QtDir "$env:QT_ROOT_DIR"
          -ExePath ./build/ci-windows/ntscreenshot.exe
          -VcpkgInstalledDir ./build/ci-windows/vcpkg_installed
          -VcpkgTriplet x64-windows
          -Zip

      - name: Upload portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ntscreenshot-windows-${{ github.sha }}
          path: dist/ntscreenshot-x64-Release.zip
          if-no-files-found: error
          retention-days: 7
