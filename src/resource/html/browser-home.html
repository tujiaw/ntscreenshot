<!DOCTYPE html>
<!-- 主题由 BrowserPanel::installHomeThemeScript() 在运行时同步。 -->
<html lang="zh-CN" data-nt-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>浏览器主页</title>
  <style>
    :root,
    html[data-nt-theme="light"] {
      color-scheme: light;
      --canvas: #ffffff;
      --surface: #f7f8fa;
      --border: rgba(15, 23, 42, 0.14);
      --border-focus: #3b82f6;
      --text: #111827;
      --text-secondary: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-subtle: rgba(37, 99, 235, 0.10);
      --focus-ring: rgba(37, 99, 235, 0.18);
      --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }

    html[data-nt-theme="dark"] {
      color-scheme: dark;
      --canvas: #0f1115;
      --surface: #161a20;
      --border: rgba(255, 255, 255, 0.14);
      --border-focus: #6ea0f8;
      --text: #e6edf3;
      --text-secondary: #8b949e;
      --accent: #5b94f8;
      --accent-hover: #78a8fb;
      --accent-subtle: rgba(91, 148, 248, 0.14);
      --focus-ring: rgba(91, 148, 248, 0.22);
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.30);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 24px;
      background: var(--canvas);
      color: var(--text);
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100%, 620px);
      margin-top: -8vh;
      text-align: center;
    }

    .mark {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--accent-subtle);
      color: var(--accent);
    }

    .mark svg { width: 26px; height: 26px; }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.35;
      font-weight: 650;
      letter-spacing: 0.2px;
    }

    .hint {
      margin: 8px 0 24px;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.6;
    }

    form {
      display: flex;
      gap: 8px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    form:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 4px var(--focus-ring), var(--shadow);
    }

    input {
      min-width: 0;
      flex: 1;
      height: 42px;
      padding: 0 12px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 16px;
    }

    input::placeholder { color: var(--text-secondary); opacity: 1; }

    button {
      height: 42px;
      padding: 0 20px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #ffffff;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: var(--accent-hover); }
    button:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }

    .privacy {
      margin: 16px 0 0;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 460px) {
      body { padding: 24px 16px; }
      main { margin-top: -4vh; }
      form { gap: 6px; }
      button { padding: 0 15px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="6.5" />
        <path d="m16 16 4 4" />
      </svg>
    </div>
    <h1>浏览网页</h1>
    <p class="hint">搜索网页，或在对话中告诉 AI 你想找什么。</p>
    <form action="https://www.bing.com/search" method="get" role="search">
      <input name="q" type="search" aria-label="搜索网页" placeholder="输入搜索关键词" autocomplete="off" autofocus />
      <button type="submit">搜索</button>
    </form>
    <p class="privacy">需要登录或验证码时，AI 会请你接手。</p>
  </main>
</body>
</html>
